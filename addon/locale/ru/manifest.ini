summary = "simpleCopy"
description = """Simple Copy — это дополнение для NVDA, которое упрощает копирование и сбор текста. Вы можете копировать выделенный текст, добавлять несколько фрагментов в буфер обмена, копировать с помощью курсора просмотра, копировать URL-адреса браузера и гиперссылки, а также копировать недавно произнесенную речь или последовательность речи. Оно также включает диспетчер истории URL-адресов для сохранения и организации скопированных ссылок. Поддерживается очистка буфера обмена. Дополнение ориентировано на плавный рабочий процесс и надежную работу с буфером обмена.
Hot Keys:
CTRL+Shift+A
Одинарное нажатие : Копировать URL
Двойное нажатие : Копировать гиперссылку
Тройное нажатие : История URL
CTRL+Shift+V
Одинарное нажатие : Копировать и добавить текст
Двойное нажатие : Копировать с курсора просмотра
Тройное нажатие : Очистить буфер обмена
F9
Одинарное нажатие : Копировать последнюю речь
Двойное нажатие : Добавить последнюю речь
Тройное нажатие : Копировать до последней речи
Shift+F9
Одинарное нажатие : перейти к предыдущему элементу истории речи
Двойное нажатие : перейти к следующему элементу истории речи
Тройное нажатие : Открыть файл истории записанной речи"""