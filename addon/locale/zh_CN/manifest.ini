summary = "简单复制"
description = """SimpleCopy 通过智能剪贴板文本追加、审阅光标文本提取、窗口文本复制、浏览器 URL 与超链接捕获、URL 历史记录管理以及语音历史记录日志记录，来增强工作流程。
热键：
控制键+Shift+A
单击：复制 URL
双击：复制超链接
三击：URL 历史记录
控制键+Shift+V
单击：复制并追加文本
双击：从审阅光标复制
三击：清空剪贴板
F9
单击：复制最后一条语音
双击：追加最后一条语音
三击：复制直到最后一条语音
Shift+F9
单击：导航至上一个语音历史记录项
双击：导航至下一个语音历史记录项
三击：打开记录的语音历史记录文件"""