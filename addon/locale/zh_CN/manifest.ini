summary = "simpleCopy"
description = """Simple Copy 是一个 NVDA 插件，可让复制和收集文本变得更加容易。您可以复制选中的文本、将多个选中项追加到剪贴板、从审阅光标复制、复制浏览器网址和超链接、以及复制最近朗读的语音或语音序列。它还包含一个网址历史管理器，用于保存和整理复制的链接。支持清空剪贴板。该插件专注于流畅的工作流程和可靠的剪贴板操作。
Hot Keys:
CTRL+Shift+A
单击 : 复制网址
双击 : 复制超链接
三击 : 网址历史
CTRL+Shift+V
单击 : 复制并追加文本
双击 : 从审阅光标复制
三击 : 清空剪贴板
F9
单击 : 复制上一语音
双击 : 追加上一语音
三击 : 复制到上一语音
Shift+F9
单击 : 导航到上一个语音历史记录项
双击 : 导航到下一个语音历史记录项
三击 : 打开记录的语音历史记录文件"""