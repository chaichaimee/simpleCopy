summary = "simpleCopy"
description = """SimpleCopy 通过智能剪贴板文本追加、审阅光标文本提取、窗口文本复制、浏览器 URL 和超链接捕获、URL 历史记录管理以及语音历史记录日志记录来增强工作流。
快捷键：
CTRL+Shift+A
单击 : 复制 URL
双击 : 复制超链接
三击 : URL 历史记录
CTRL+Shift+V
单击 : 复制并追加文本
双击 : 从审阅光标复制
三击 : 清空剪贴板
F9
单击 : 复制最后的语音
双击 : 追加最后的语音
三击 : 复制到最后的语音
Shift+F9
单击 : 导航到上一个语音历史记录项
双击 : 导航到下一个语音历史记录项
三击 : 打开语音历史记录文件"""