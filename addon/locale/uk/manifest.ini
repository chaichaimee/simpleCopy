summary = "simpleCopy"
description = """Simple Copy — це додаток для NVDA, який спрощує копіювання та збір тексту. Ви можете копіювати виділений текст, додавати кілька виділень до буфера обміну, копіювати з курсору огляду, копіювати URL-адреси браузера та гіперпосилання, а також копіювати нещодавно вимовлений текст або послідовність мовлення. Він також містить менеджер історії URL-адресів для збереження та впорядкування скопійованих посилань. Підтримується очищення буфера обміну. Додаток орієнтований на плавний робочий процес та надійну роботу з буфером обміну.
Hot Keys:
CTRL+Shift+A
Одинарний тап : Копіювати URL
Подвійний тап : Копіювати гіперпосилання
Потрійний тап : Історія URL
CTRL+Shift+V
Одинарний тап : Копіювати та додати текст
Подвійний тап : Копіювати з курсору огляду
Потрійний тап : Очистити буфер обміну
F9
Одинарний тап : Копіювати останнє мовлення
Подвійний тап : Додати останнє мовлення
Потрійний тап : Копіювати до останнього мовлення
Shift+F9
Одинарний тап : перейти до попереднього елемента історії мовлення
Подвійний тап : перейти до наступного елемента історії мовлення
Потрійний тап : Відкрити файл історії записаного мовлення"""