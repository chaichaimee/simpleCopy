summary = "simpleCopy"
description = """Simple Copy è un componente aggiuntivo per NVDA che semplifica la copia e la raccolta del testo. È possibile copiare il testo selezionato, aggiungere più selezioni negli appunti, copiare dal cursore di revisione, copiare URL del browser e collegamenti ipertestuali, e copiare il parlato recente o una sequenza di parlato. Include anche un gestore della cronologia degli URL per salvare e organizzare i collegamenti copiati. È supportata la pulizia degli appunti. Il componente aggiuntivo si concentra su un flusso di lavoro fluido e operazioni degli appunti affidabili.
Hot Keys:
CTRL+Shift+A
Un tocco : Copia URL
Doppio tocco : Copia collegamento ipertestuale
Triplo tocco : Cronologia URL
CTRL+Shift+V
Un tocco : Copia e aggiungi testo
Doppio tocco : Copia dal cursore di revisione
Triplo tocco : Pulisci appunti
F9
Un tocco : Copia ultimo parlato
Doppio tocco : Aggiungi ultimo parlato
Triplo tocco : Copia fino all'ultimo parlato
Shift+F9
Un tocco : Passa all'elemento precedente della cronologia vocale
Doppio tocco : Passa all'elemento successivo della cronologia vocale
Triplo tocco : Apri il file della cronologia del parlato registrato"""