summary = "simpleCopy"
description = """Simple Copy هو إضافة لـ NVDA تسهل نسخ النصوص وجمعها. يمكنك نسخ النص المحدد، وإضافة تحديدات متعددة إلى الحافظة، ونسخ النص من مؤشر المراجعة، ونسخ عناوين URL للمتصفح والارتباطات التشعبية، ونسخ الكلام المنطوق مؤخراً أو تسلسل الكلام. كما يتضمن مدير تاريخ عناوين URL لحفظ وتنظيم الروابط المنسوحة. يتم دعم مسح الحافظة. تركز الإضافة على سير عمل سلس وعمليات حافظة موثوقة.
Hot Keys:
CTRL+Shift+A
ضغطة واحدة : نسخ عنوان URL
ضغطة مزدوجة : نسخ الارتباط التشعبي
ثلاث ضغطات : سجل عناوين URL
CTRL+Shift+V
ضغطة واحدة : نسخ النص وإضافته
ضغطة مزدوجة : النسخ من مؤشر المراجعة
ثلاث ضغطات : مسح الحافظة
F9
ضغطة واحدة : نسخ آخر كلام
ضغطة مزدوجة : إلحاق آخر كلام
ثلاث ضغطات : نسخ حتى آخر كلام
Shift+F9
ضغطة واحدة : الانتقال إلى عنصر سجل الكلام السابق
ضغطة مزدوجة : الانتقال إلى عنصر سجل الكلام التالي
ثلاث ضغطات : فتح ملف سجل الكلام المسجل"""