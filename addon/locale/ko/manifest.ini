summary = "simpleCopy"
description = """궁극의 캡처 능력: URL, 텍스트, 마지막 음성 출력 내용까지 이 모든 것을 손끝에서 더 빠르고 스마트하게 처리합니다.
단축키:
CTRL+Shift+A
한 번 누름: URL 복사
 두 번 누름: 하이퍼링크 복사
CTRL+Shift+V
한 번 누름: 텍스트 복사 및 덧붙이기
 두 번 누름: 검토 커서에서 복사
세 번 누름: 클립보드 비우기
F9
한 번 누름: 마지막 음성 복사
두 번 누름: 마지막 음성 덧붙이기
세 번 누름: 마지막 음성까지 복사
Shift+F9
한 번 누름: 이전 음성 기록 항목으로 이동
두 번 누름: 다음 음성 기록 항목으로 이동
세 번 누름: 기록된 음성 기록 파일 열기"""