summary = "simpleCopy"
description = """Simple Copy는 텍스트 복사 및 수집을 더 쉽게 만들어 주는 NVDA 애드온입니다. 텍스트 선택 복사, 클립보드에 여러 선택 항목 추가, 검토 커서에서 복사, 브라우저 URL 및 하이퍼링크 복사, 최근에 음성으로 출력된 내용이나 연속된 음성 복사가 가능합니다. 또한 복사된 링크를 저장하고 관리할 수 있는 URL 기록 관리자도 포함되어 있습니다. 클립보드 지우기가 지원됩니다. 이 애드온은 원활한 작업 흐름과 안정적인 클립보드 작업에 중점을 둡니다.
Hot Keys:
CTRL+Shift+A
한 번 탭 : URL 복사
두 번 탭 : 하이퍼링크 복사
세 번 탭 : URL 기록
CTRL+Shift+V
한 번 탭 : 텍스트 복사 및 추가
두 번 탭 : 검토 커서에서 복사
세 번 탭 : 클립보드 지우기
F9
한 번 탭 : 마지막 음성 복사
두 번 탭 : 마지막 음성 추가
세 번 탭 : 마지막 음성까지 복사
Shift+F9
한 번 탭 : 이전 음성 기록 항목으로 이동
두 번 탭 : 다음 음성 기록 항목으로 이동
세 번 탭 : 기록된 음성 기록 파일 열기"""