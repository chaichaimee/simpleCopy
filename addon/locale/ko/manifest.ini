summary = "간단 복사"
description = """SimpleCopy는 스마트 클립보드 텍스트 추가, 검토 커서 텍스트 추출, 창 텍스트 복사, 브라우저 URL 및 하이퍼링크 캡처, URL 기록 관리, 음성 기록 로깅을 통해 작업을 향상시킵니다.
단축키:
CTRL+Shift+A
한 번 탭: URL 복사
두 번 탭: 하이퍼링크 복사
세 번 탭: URL 기록
CTRL+Shift+V
한 번 탭: 텍스트 복사 및 추가
두 번 탭: 검토 커서에서 복사
세 번 탭: 클립보드 지우기
F9
한 번 탭: 마지막 음성 복사
두 번 탭: 마지막 음성 추가
세 번 탭: 마지막 음성까지 복사
Shift+F9
한 번 탭: 이전 음성 기록 항목으로 이동
두 번 탭: 다음 음성 기록 항목으로 이동
세 번 탭: 녹음된 음성 기록 파일 열기"""