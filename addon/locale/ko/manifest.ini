summary = "simpleCopy"
description = """궁극의 캡처 기능: URL, 텍스트, 마지막으로 읽은 음성; 손끝에서 더 빠르고 스마트하게 제어
단축키:
CTRL+Shift+A
한 번 누르기 : URL 복사
 두 번 누르기 : 하이퍼링크 복사
CTRL+Shift+C
한 번 누르기 : 텍스트 복사 및 덧붙이기
 두 번 누르기 : 클립보드 지우기
F9
한 번 누르기 : 마지막 음성 복사
두 번 누르기 : 마지막 음성 덧붙이기
세 번 누르기 : 마지막 음성까지 복사
Shift+F9
한 번 누르기 : 이전 음성 기록 항목으로 이동
두 번 누르기 : 다음 음성 기록 항목으로 이동
세 번 누르기 : 음성 기록 파일 열기"""