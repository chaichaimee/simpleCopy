summary = "simpleCopy"
description = """SimpleCopy mejora los flujos de trabajo con adición inteligente de texto al portapapeles, extracción de texto del cursor de revisión, copiado de texto de ventanas, captura de URL y enlaces de hipertexto de navegadores, gestión del historial de URL y registro del historial de voz.

Teclas rápidas:
Control+Mayús+A
Un toque: Copiar URL
Doble toque: Copiar hiperenlace
Triple toque: Historial de URL

Control+Mayús+V
Un toque: Copiar y añadir texto
Doble toque: Pegar línea por línea
Triple toque: Limpiar portapapeles

Mayús+Windows+V
Un toque: Copiar desde el cursor de revisión

F9
Un toque: Copiar último discurso
Doble toque: Añadir último discurso
Triple toque: Copiar hasta el último discurso

Mayús+F9
Un toque: navegar al elemento anterior del historial de voz
Doble toque: navegar al elemento siguiente del historial de voz
Triple pulsación: Abrir archivo de historial de voz grabada"""