summary = "simpleCopy"
description = """Simple Copy es un complemento para NVDA que facilita la copia y recopilación de texto. Puedes copiar texto seleccionado, añadir múltiples selecciones al portapapeles, copiar desde el cursor de revisión, copiar URLs de navegadores e hipervínculos, y copiar la voz hablada recientemente o una secuencia de voz. También incluye un administrador de historial de URLs para guardar y organizar enlaces copiados. Se admite el vaciado del portapapeles. El complemento se centra en un flujo de trabajo fluido y operaciones de portapapeles confiables.
Hot Keys:
CTRL+Shift+A
Un toque : Copiar URL
Doble toque : Copiar hipervínculo
Triple toque : Historial de URLs
CTRL+Shift+V
Un toque : Copiar y añadir texto
Doble toque : Copiar desde el cursor de revisión
Triple toque : Limpiar portapapeles
F9
Un toque : Copiar última locución
Doble toque : Añadir última locución
Triple toque : Copiar hasta la última locución
Shift+F9
Un toque : Navegar al elemento anterior del historial de voz
Doble toque : Navegar al siguiente elemento del historial de voz
Triple toque : Abrir archivo de historial de voz grabado"""