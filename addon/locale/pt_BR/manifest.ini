summary = "simpleCopy"
description = """Simple Copy é um complemento do NVDA que torna a cópia e coleta de texto mais fácil. Você pode copiar texto selecionado, anexar múltiplas seleções à área de transferência, copiar a partir do cursor de revisão, copiar URLs de navegadores e hiperlinks, e copiar a fala falada recentemente ou uma sequência de fala. Ele também inclui um gerenciador de histórico de URLs para salvar e organizar links copiados. A limpeza da área de transferência é suportada. O complemento foca em um fluxo de trabalho suave e operações confiáveis na área de transferência.
Hot Keys:
CTRL+Shift+A
Um toque : Copiar URL
Dois toques : Copiar Hiperlink
Três toques : Histórico de URLs
CTRL+Shift+V
Um toque : Copiar e anexar texto
Dois toques : Copiar do Cursor de Revisão
Três toques : Limpar área de transferência
F9
Um toque : Copiar Última Fala
Dois toques : Anexar Última Fala
Três toques : Copiar Até a Última Fala
Shift+F9
Um toque : navegar para o item anterior do histórico de fala
Dois toques : navegar para o próximo item do histórico de fala
Três toques : Abrir Arquivo de Histórico de Fala Gravado"""