summary = "simpleCopy"
description = """Simple Copy ist eine NVDA-Erweiterung, die das Kopieren und Sammeln von Text erleichtert. Sie können ausgewählten Text kopieren, mehrere Auswahlen an die Zwischenablage anhängen, vom Prüfcursor kopieren, Browser-URLs und Hyperlinks kopieren sowie kürzlich gesprochene Sprache oder eine Sprachsequenz kopieren. Sie enthält außerdem einen URL-Verlaufsmanager zum Speichern und Organisieren kopierter Links. Das Leeren der Zwischenablage wird unterstützt. Die Erweiterung konzentriert sich auf einen reibungslosen Arbeitsablauf und zuverlässige Zwischenablagenoperationen.
Hot Keys:
CTRL+Shift+A
Einfachklick : URL kopieren
Doppelklick : Hyperlink kopieren
Dreifachklick : URL-Verlauf
CTRL+Shift+V
Einfachklick : Text kopieren und anhängen
Doppelklick : Vom Prüfcursor kopieren
Dreifachklick : Zwischenablage leeren
F9
Einfachklick : Letzte Sprachausgabe kopieren
Doppelklick : Letzte Sprachausgabe anhängen
Dreifachklick : Bis zur letzten Sprachausgabe kopieren
Shift+F9
Einfachklick : Zum vorherigen Element des Sprachverlaufs navigieren
Doppelklick : Zum nächsten Element des Sprachverlaufs navigieren
Dreifachklick : Datei des aufgezeichneten Sprachverlaufs öffnen"""