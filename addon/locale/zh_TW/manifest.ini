summary = "簡易複製"
description = """SimpleCopy 透過智慧型剪貼簿文字附加、檢閱游標文字擷取、視窗文字複製、瀏覽器網址與超連結擷取、網址歷史記錄管理以及語音歷史記錄日誌，來增進工作流程。

熱鍵：
控制鍵+Shift+A
單擊：複製網址
雙擊：複製超連結
三擊：網址歷史記錄

控制鍵+Shift+V
單擊：複製並附加文字
雙擊：逐行貼上
三擊：清除剪貼簿

Shift+Windows+V
單擊：從檢閱游標複製

F9
單擊：複製最後語音
雙擊：附加最後語音
三擊：複製直到最後語音

Shift+F9
單擊：導覽至上一個語音歷史記錄項目
雙擊：導覽至下一個語音歷史記錄項目
三指連按：開啟語音記錄歷史檔案"""