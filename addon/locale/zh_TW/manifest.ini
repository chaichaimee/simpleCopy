summary = "simpleCopy"
description = """Simple Copy 是一個 NVDA 附加元件，可讓複製和收集文字變得更加容易。您可以複製選取的文字、將多個選取項目附加到剪貼簿、從檢視游標複製、複製瀏覽器網址和超連結，以及複製最近朗讀的語音或語音序列。它還包含一個網址歷史記錄管理員，用於儲存和整理複製的連結。支援清除剪貼簿。該附加元件專注於流暢的工作流程和可靠的剪貼簿操作。
Hot Keys:
CTRL+Shift+A
單擊 : 複製網址
雙擊 : 複製超連結
三擊 : 網址歷史記錄
CTRL+Shift+V
單擊 : 複製並附加文字
雙擊 : 從檢視游標複製
三擊 : 清除剪貼簿
F9
單擊 : 複製上一語音
雙擊 : 附加上一語音
三擊 : 複製到上一語音
Shift+F9
單擊 : 導航到上一個語音歷史記錄項目
雙擊 : 導航到下一個語音歷史記錄項目
三擊 : 開啟記錄的語音歷史記錄檔案"""