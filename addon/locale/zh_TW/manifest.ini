summary = "simpleCopy"
description = """SimpleCopy 透過智慧剪貼板文字附加、審閱游標文字擷取、視窗文字複製、瀏覽器 URL 與超連結擷取、URL 歷史記錄管理以及語音歷史記錄日誌記錄來增強工作流程。
快捷鍵：
CTRL+Shift+A
單擊 : 複製 URL
雙擊 : 複製超鏈結
三擊 : URL 歷史記錄
CTRL+Shift+V
單擊 : 複製並附加文字
雙擊 : 從審閱游標複製
三擊 : 清空剪貼板
F9
單擊 : 複製最後的語音
雙擊 : 附加最後的語音
三擊 : 複製到最後的語音
Shift+F9
單擊 : 導覽至上一個語音歷史記錄項目
雙擊 : 導覽至下一個語音歷史記錄項目
三擊 : 開啟語音歷史記錄檔案"""