summary = "simpleCopy"
description = """Simple Copy adalah add-on NVDA yang membuat penyalinan dan pengumpulan teks menjadi lebih mudah. Anda dapat menyalin teks yang dipilih, menambahkan beberapa pilihan ke clipboard, menyalin dari kursor peninjau, menyalin URL peramban dan hyperlink, serta menyalin ucapan yang baru saja diucapkan atau urutan ucapan. Add-on ini juga menyertakan pengelola riwayat URL untuk menyimpan dan mengatur tautan yang disalin. Penghapusan clipboard didukung. Add-on ini berfokus pada alur kerja yang mulus dan operasi clipboard yang andal.
Hot Keys:
CTRL+Shift+A
Ketuk Sekali : Salin URL
Ketuk Dua Kali : Salin Hyperlink
Ketuk Tiga Kali : Riwayat URL
CTRL+Shift+V
Ketuk Sekali : Salin dan Tambahkan teks
Ketuk Dua Kali : Salin dari Kursor Peninjau
Ketuk Tiga Kali : Bersihkan clipboard
F9
Ketuk Sekali : Salin Ucapan Terakhir
Ketuk Dua Kali : Tambahkan Ucapan Terakhir
Ketuk Tiga Kali : Salin Hingga Ucapan Terakhir
Shift+F9
Ketuk Sekali : navigasi ke item riwayat ucapan sebelumnya
Ketuk Dua Kali : navigasi ke item riwayat ucapan berikutnya
Ketuk Tiga Kali : Buka Berkas Riwayat Ucapan yang Direkam"""