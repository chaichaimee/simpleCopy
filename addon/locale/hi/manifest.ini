summary = "simpleCopy"
description = """Simple Copy एक NVDA एड-ऑन है जो टेक्स्ट को कॉपी और एकत्र करना आसान बनाता है। आप चयनित टेक्स्ट को कॉपी कर सकते हैं, क्लिपबोर्ड में कई चयनों को जोड़ सकते हैं, समीक्षा कर्सर से कॉपी कर सकते हैं, ब्राउज़र URL और हाइपरलिंक कॉपी कर सकते हैं, और हाल ही में बोली गई वाणी या वाणी के क्रम को कॉपी कर सकते हैं। इसमें कॉपी किए गए लिंक को सहेजने और व्यवस्थित करने के लिए एक URL इतिहास प्रबंधक भी शामिल है। क्लिपबोर्ड साफ़ करने का समर्थन किया जाता है। एड-ऑन सुचारू कार्यप्रवाह और विश्वसनीय क्लिपबोर्ड संचालन पर केंद्रित है।
Hot Keys:
CTRL+Shift+A
एक बार टैप करें : URL कॉपी करें
दो बार टैप करें : हाइपरलिंक कॉपी करें
तीन बार टैप करें : URL इतिहास
CTRL+Shift+V
एक बार टैप करें : टेक्स्ट कॉपी करें और जोड़ें
दो बार टैप करें : समीक्षा कर्सर से कॉपी करें
तीन बार टैप करें : क्लिपबोर्ड साफ़ करें
F9
एक बार टैप करें : अंतिम वाणी कॉपी करें
दो बार टैप करें : अंतिम वाणी जोड़ें
तीन बार टैप करें : अंतिम वाणी तक कॉपी करें
Shift+F9
एक बार टैप करें : पिछले वाणी इतिहास आइटम पर नेविगेट करें
दो बार टैप करें : अगले वाणी इतिहास आइटम पर नेविगेट करें
तीन बार टैप करें : रिकॉर्डेड वाणी इतिहास फ़ाइल खोलें"""