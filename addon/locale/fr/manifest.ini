summary = "simpleCopy"
description = """Simple Copy est un add-on NVDA qui facilite la collecte et la copie de texte. Vous pouvez copier du texte sélectionné, ajouter plusieurs sélections au presse-papiers, copier à partir du curseur de révision, copier des URL de navigateur et des hyperliens, et copier la parole récemment prononcée ou une séquence vocale. Il comprend également un gestionnaire d'historique des URL pour enregistrer et organiser les liens copiés. Le nettoyage du presse-papiers est pris en charge. L'add-on se concentre sur un flux de travail fluide et des opérations de presse-papiers fiables.
Hot Keys:
CTRL+Shift+A
Simple appui : Copier l'URL
Double appui : Copier l'hyperlien
Triple appui : Historique des URL
CTRL+Shift+V
Simple appui : Copier et ajouter du texte
Double appui : Copier à partir du curseur de révision
Triple appui : Vider le presse-papiers
F9
Simple appui : Copier la dernière parole
Double appui : Ajouter la dernière parole
Triple appui : Copier jusqu'à la dernière parole
Shift+F9
Simple appui : Naviguer vers l'élément précédent de l'historique de la parole
Double appui : Naviguer vers l'élément suivant de l'historique de la parole
Triple appui : Ouvrir le fichier d'historique de la parole enregistré"""