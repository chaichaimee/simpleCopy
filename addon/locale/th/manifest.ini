summary = "simpleCopy"
description = """Simple Copy เป็นแอดออนของ NVDA ที่ช่วยให้การคัดลอกและรวบรวมข้อความเป็นเรื่องง่าย คุณสามารถคัดลอกข้อความที่เลือก เพิ่มการเลือกหลายรายการไปยังคลิปบอร์ด คัดลอกข้อความจากเคอร์เซอร์ทบทวน คัดลอก URL ของเบราว์เซอร์และไฮเปอร์ลิงก์ และคัดลอกคำพูดที่เพิ่งพูดล่าสุดหรือลำดับคำพูด นอกจากนี้ยังมีตัวจัดการประวัติ URL สำหรับบันทึกและจัดระเบียบลิงก์ที่คัดลอก รองรับการล้างคลิปบอร์ด แอดออนนี้เน้นการทำงานที่ราบรื่นและการจัดการคลิปบอร์ดที่เชื่อถือได้
Hot Keys:
CTRL+Shift+A
แตะครั้งเดียว : คัดลอก URL
แตะสองครั้ง : คัดลอกไฮเปอร์ลิงก์
แตะสามครั้ง : ประวัติ URL
CTRL+Shift+V
แตะครั้งเดียว : คัดลอกและเพิ่มข้อความ
แตะสองครั้ง : คัดลอกเนื้อหาจากเคอร์เซอร์ทบทวน
แตะสามครั้ง : ล้างคลิปบอร์ด
F9
แตะครั้งเดียว : คัดลอกคำพูดล่าสุด
แตะสองครั้ง : เพิ่มคำพูดล่าสุด
แตะสามครั้ง : คัดลอกจนถึงคำพูดล่าสุด
Shift+F9
แตะครั้งเดียว : ไปยังรายการประวัติคำพูดก่อนหน้า
แตะสองครั้ง : ไปยังรายการประวัติคำพูดถัดไป
แตะสามครั้ง : เปิดไฟล์ประวัติคำพูดที่บันทึกไว้"""