summary = "simpleCopy"
description = """SimpleCopy は、クリップボードテキストのスマートな追加、レビューカーソルからのテキスト抽出、ウィンドウテキストのコピー、ブラウザの URL とハイパーリンクのキャプチャ、URL 履歴の管理、および音声履歴の記録によってワークフローを向上させます。
ホットキー:
CTRL+Shift+A
1回タップ : URL をコピー
2回タップ : ハイパーリンクをコピー
3回タップ : URL 履歴
CTRL+Shift+V
1回タップ : コピーしてテキストを追加
2回タップ : レビューカーソルからコピー
3回タップ : クリップボードをクリア
F9
1回タップ : 最後の音声をコピー
2回タップ : 最後の音声を追加
3回タップ : 最後の音声までコピー
Shift+F9
1回タップ : 前の音声履歴アイテムに移動
2回タップ : 次の音声履歴アイテムに移動
3回タップ : 音声履歴ファイルを開く"""