summary = "simpleCopy"
description = """究極のキャプチャパワー：URL、テキスト、最後に読み上げられた音声。すべてが指先ひとつで、より速く、よりスマートに
ホットキー：
CTRL+Shift+A
1回押す：URLをコピー
 2回押す：ハイパーリンクをコピー
CTRL+Shift+V
1回押す：テキストをコピーして追加
 2回押す：レビューカーソルからコピー
3回押す：クリップボードを消去
F9
1回押す：最後の音声をコピー
2回押す：最後の音声を追加
3回押す：最後の音声までコピー
Shift+F9
1回押す：音声履歴の前の項目へ移動
2回押す：音声履歴の次の項目へ移動
3回押す：録音された音声履歴ファイルを開く"""