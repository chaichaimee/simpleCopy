summary = "SimpleCopy"
description = """SimpleCopyは、スマートなクリップボードテキストの追加、レビューカーソルテキストの抽出、ウィンドウテキストのコピー、ブラウザのURLとハイパーリンクの取得、URL履歴の管理、音声履歴の記録によって作業効率を向上させます。
ホットキー:
Ctrl+Shift+A
1回タップ: URLをコピー
2回タップ: ハイパーリンクをコピー
3回タップ: URL履歴
Ctrl+Shift+V
1回タップ: コピーしてテキストを追加
2回タップ: レビューカーソルからコピー
3回タップ: クリップボードをクリア
F9
1回タップ: 最後の音声をコピー
2回タップ: 最後の音声を追加
3回タップ: 最後の音声までをコピー
Shift+F9
1回タップ: 前の音声履歴項目に移動
2回タップ: 次の音声履歴項目に移動
3回タップ: 記録された音声履歴ファイルを開く"""