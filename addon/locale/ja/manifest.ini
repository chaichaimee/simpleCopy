summary = "simpleCopy"
description = """究極のキャプチャ機能：URL、テキスト、最後に読み上げられた音声。すべてをより速く、よりスマートに指先で操作
ホットキー：
CTRL+Shift+A
1回押す : URLをコピー
 2回押す : ハイパーリンクをコピー
CTRL+Shift+C
1回押す : テキストをコピーして追記
 2回押す : クリップボードを消去
F9
1回押す : 最後の音声出力をコピー
2回押す : 最後の音声出力を追記
3回押す : 最後の音声出力までコピー
Shift+F9
1回押す : 前の音声履歴アイテムに移動
2回押す : 次の音声履歴アイテムに移動
3回押す : 音声履歴の記録ファイルを開く"""