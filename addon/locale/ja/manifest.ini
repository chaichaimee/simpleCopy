summary = "簡易コピー"
description = """SimpleCopy は、クリップボードテキストのスマートな追加、レビューカーソルからのテキスト抽出、ウィンドウテキストのコピー、ブラウザのURLとハイパーリンクの取得、URL履歴の管理、および音声履歴の記録によって、作業効率を向上させます。

ホットキー:
Ctrl+Shift+A
1回タップ: URLをコピー
2回タップ: ハイパーリンクをコピー
3回タップ: URL履歴

Ctrl+Shift+V
1回タップ: コピーしてテキストを追加
2回タップ: 行ごとに貼り付け
3回タップ: クリップボードをクリア

Shift+Windows+V
1回タップ: レビューカーソルからコピー

F9
1回タップ: 最後の発話をコピー
2回タップ: 最後の発話を追加
3回タップ: 最後の発話までをコピー

Shift+F9
1回タップ: 前の音声履歴項目へ移動
2回タップ: 次の音声履歴項目へ移動
3本指でダブルタップ: 音声記録履歴ファイルを開く"""