summary = "simpleCopy"
description = """Simple Copy は、テキストのコピーと収集を簡単にする NVDA アドオンです。選択したテキストのコピー、複数の選択範囲のクリップボードへの追加、レビューカーソルからのコピー、ブラウザのURLやハイパーリンクのコピー、最近読み上げられた音声や一連の音声のコピーが可能です。また、コピーしたリンクを保存・整理するためのURL履歴マネージャーも含まれています。クリップボードのクリア機能がサポートされています。このアドオンは、スムーズなワークフローと信頼性の高いクリップボード操作に重点を置いています。
Hot Keys:
CTRL+Shift+A
1回タップ : URLをコピー
2回タップ : ハイパーリンクをコピー
3回タップ : URL履歴
CTRL+Shift+V
1回タップ : テキストをコピーして追加
2回タップ : レビューカーソルからコピー
3回タップ : クリップボードをクリア
F9
1回タップ : 最後の音声をコピー
2回タップ : 最後の音声を追加
3回タップ : 最後の音声までコピー
Shift+F9
1回タップ : 前の音声履歴項目へ移動
2回タップ : 次の音声履歴項目へ移動
3回タップ : 記録された音声履歴ファイルを開く"""