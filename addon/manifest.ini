name = simpleCopy
summary = "simpleCopy"
description = """Simple Copy is an NVDA add-on that makes copying and collecting text easier. You can copy selected text, append multiple selections to the clipboard, copy from the review cursor, copy browser URLs and hyperlinks, and copy recently spoken speech or a sequence of speech. It also includes a URL history manager for saving and organizing copied links. Clipboard clearing is supported. The add-on focuses on smooth workflow and reliable clipboard operations.
Hot Keys:
CTRL+Shift+A
Single Tap : Copy URL
 Double Tap : Copy Hyper Link
Triple Tapp : URL History
CTRL+Shift+V
Single Tap : Copy and Append text
 Double Tap : Copy from Review Cursur
Tripple Tap : Clear clipboard
F9
Single Tap : Copy Last Speech
Double Tap : Append Last Speech
Triple Tap : Copy Until Last Speech
Shift+F9
Single Tap : navigate to previous speech history item
Double Tap : navigate to next speech history item
Tripple Tap : Open Record Speech History File"""
author = "Chai Chaimee <chaicm75@gmail.com>"
url = https://github.com/chaichaimee/simpleCopy
